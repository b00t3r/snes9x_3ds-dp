name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # This legacy codebase was originally built with the older devkitARM
      # ABI. Use the 2024 toolchain while retaining the relocation repair in
      # the Makefile for current 3DSX loaders.
      image: devkitpro/devkitarm:20240511

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build 3DSX
        run: make -j2 build

      - name: Upload Homebrew Launcher build
        uses: actions/upload-artifact@v4
        with:
          name: snes9x-3ds-dp
          path: |
            *.3dsx
            *.smdh
            *.elf
            *.map
          if-no-files-found: error
