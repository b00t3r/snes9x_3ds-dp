name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # GCC 16 currently produces 3DSX relocations rejected by Azahar and
      # the Homebrew Launcher for this legacy codebase. Keep the last GCC 15
      # toolchain until the emulator's low-level GPU code is modernized.
      image: devkitpro/devkitarm:20260221

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build 3DSX
        run: make -j2 build

      - name: Upload Homebrew Launcher build
        uses: actions/upload-artifact@v4
        with:
          name: snes9x-3ds-dp
          path: |
            *.3dsx
            *.smdh
            *.elf
            *.map
          if-no-files-found: error
